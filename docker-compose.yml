services:
  postgres:
    image: postgres:17-alpine
    container_name: weebit_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-weebit_dev}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-weebit_secure_pass}
      POSTGRES_DB: ${POSTGRES_DB:-weebit_db}
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-weebit_dev} -d ${POSTGRES_DB:-weebit_db}"]
      interval: 2s
      timeout: 3s
      retries: 10
      start_period: 5s
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: weebit_redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 5
      start_period: 2s

volumes:
  postgres_data: